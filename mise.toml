min_version = { hard = "2026.7.4" }

[settings]
lockfile = true
locked = true
minimum_release_age = "7d"
idiomatic_version_file_enable_tools = ["java", "node", "python", "rust", "zig"]

[tools]
node = { version = "24.19.0", postinstall = "corepack enable" }
python = "3.14.3"
uv = "0.10.2"
bun = "1.3.10"
zig = "0.16.0"
rust = { version = "1.93.1", profile = "default", components = [
  "clippy",
  "rustfmt",
  "rust-analyzer",
  "rust-src",
], targets = [
  "aarch64-apple-darwin",
] }
java = "temurin-25.0.3+9.0.LTS"
maven = "3.9.11"
awscli = "2.34.11"
bazelisk = "1.26.0"
gh = "2.87.3"
git-filter-repo = "2.47.0"
gitleaks = "8.30.1"
hadolint = "2.14.0"
shellcheck = "0.11.0"
neovim = "0.12.3"
tree-sitter = "0.26.9"
"github:tectonic-typesetting/tectonic" = "0.15.0"
herdr = "0.7.4"
"npm:@earendil-works/pi-coding-agent" = "0.84.1"
claude-code = "2.1.181"
codex = "0.135.0"
opencode = "1.4.0"

[bootstrap.packages]
"brew:git" = "latest"
"brew:tmux" = "latest"
"brew:ffmpeg" = "latest"
"brew:graphviz" = "latest"
"brew:dvisvgm" = "latest"
"brew:espeak-ng" = "latest"
"brew:pkgconf" = "latest"
"brew:poppler" = "latest"
"brew:postgresql@18" = "latest"
"brew:ollama" = "latest"
"brew:tree" = "latest"
"brew-cask:docker-desktop" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:visual-studio-code" = "latest"

[bootstrap.user]
login_shell = "/bin/zsh"

[dotfiles]
"~/.config/mise/conf.d/10-public.toml" = { source = "~/Developer/dotfiles/mise.toml", mode = "symlink" }
"~/.config/mise/mise.lock" = { source = "~/Developer/dotfiles/mise.lock", mode = "symlink" }
"~/.zshenv" = { source = "~/Developer/dotfiles/dotfiles/zsh/.zshenv", mode = "symlink" }
"~/.zprofile" = { source = "~/Developer/dotfiles/dotfiles/zsh/.zprofile", mode = "symlink" }
"~/.zshrc" = { source = "~/Developer/dotfiles/dotfiles/zsh/.zshrc", mode = "symlink" }
"~/.gitconfig" = { source = "~/Developer/dotfiles/dotfiles/git/gitconfig", mode = "symlink" }
"~/.tmux.conf" = { source = "~/Developer/dotfiles/dotfiles/tmux/tmux.conf", mode = "symlink" }
"~/Library/Application Support/com.mitchellh.ghostty/config" = { source = "~/Developer/dotfiles/dotfiles/ghostty/config", mode = "symlink" }
"~/.config/herdr/config.toml" = { source = "~/Developer/dotfiles/dotfiles/herdr/config.toml", mode = "symlink" }
"~/.config/nvim" = { source = "~/Developer/dotfiles/dotfiles/nvim", mode = "symlink" }
"~/Library/Application Support/Code/User/settings.json" = { source = "~/Developer/dotfiles/dotfiles/vscode/settings.json", mode = "symlink" }
"~/.ssh/config" = { source = "~/Developer/dotfiles/dotfiles/ssh/config", mode = "symlink" }
"~/.local/bin" = { source = "~/Developer/dotfiles/dotfiles/bin", mode = "symlink-each" }

[tasks.safety]
description = "Check the repository for secret files and private identifiers"
run = "cd \"$HOME/Developer/dotfiles\" && ./scripts/check-safety.sh"

[tasks.validate]
description = "Validate configuration, ownership, and behavioral contracts"
depends = ["safety"]
run = "cd \"$HOME/Developer/dotfiles\" && ./scripts/validate.sh"

[tasks."backup:dry-run"]
description = "List managed HOME targets that require a cutover backup"
run = "cd \"$HOME/Developer/dotfiles\" && ./scripts/backup-managed-targets.sh --dry-run"

[tasks."backup:apply"]
description = "Back up managed HOME targets without changing them"
run = "cd \"$HOME/Developer/dotfiles\" && ./scripts/backup-managed-targets.sh --apply"

[tasks."tools:dry-run"]
description = "Preview locked mise tool installation"
run = "mise install --dry-run --locked"

[tasks."bootstrap:status"]
description = "Show declarative bootstrap status without applying changes"
run = "mise bootstrap status"

[tasks."bootstrap:dry-run"]
description = "Preview the complete public bootstrap"
run = "mise bootstrap --dry-run"

[tasks."pi:harness-status"]
description = "Report whether the canonical Pi Harness checkout is ready"
run = "cd \"$HOME/Developer/dotfiles\" && ./scripts/pi-harness-status.sh"

[tasks.bootstrap]
description = "Run idempotent post-tool setup after mise bootstrap"
run = [
  "cd \"$HOME/Developer/dotfiles\" && ./scripts/trust-layered-configs.sh",
  "cd \"$HOME/Developer/dotfiles\" && ./scripts/prepare-user-dirs.sh",
  "cd \"$HOME/Developer/dotfiles\" && ./scripts/install-vscode-extensions.sh",
  "cd \"$HOME/Developer/dotfiles\" && ./scripts/ensure-pi-harness.sh",
  "cd \"$HOME/Developer/dotfiles\" && ./scripts/validate.sh",
  "cd \"$HOME/Developer/dotfiles\" && ./scripts/pi-harness-status.sh",
]
